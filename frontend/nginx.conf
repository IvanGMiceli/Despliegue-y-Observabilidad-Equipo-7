# Configuración de Nginx dentro del contenedor frontend.
server {
    # Puerto interno del servidor; Compose lo publica como el puerto 3000 del equipo.
    listen 80;
    server_name _;

    # Directorio al que frontend/Dockerfile copia los archivos de public/.
    root /usr/share/nginx/html;
    index index.html;

    # Entrega los archivos solicitados y usa index.html como página de entrada alternativa.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Las llamadas fetch('/api/...') llegan a Nginx, que las reenvía a FastAPI.
    # 'backend' se resuelve por DNS interno de Compose; Uvicorn escucha en el puerto 8000.
    # La barra final de proxy_pass quita /api/: /api/usuarios/1 llega como /usuarios/1.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        # Conserva información del host y de la solicitud original para el backend.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

